[project]
name = "core"
version = "0.1.0"
description = "Shared library: models, abstract scrapers/enrichers, DB repository, HTTP client, logging"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.51",
    "curl-cffi>=0.15.0",
    "pydantic>=2.13.0",
    "sentencex>=1.0.30",
    "instructor>=1.7.0",
    "openai>=1.60.0",
    "psycopg2-binary>=2.9.9",
    "boto3>=1.34.0",
    "inscriptis>=2.5.0",
    "markdown>=3.5.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.12.0",
    "html2text>=2024.2.26",
    "sqlite-vec>=0.1.9",
    "lingua-language-detector>=2.1.1",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.4.0",
    "torch",
    "einops>=0.8.0",
]
vision = [
    "pymupdf4llm>=0.0.17",
    "torch",
    "torchvision",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]
