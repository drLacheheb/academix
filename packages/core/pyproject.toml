[project]
name = "core"
version = "0.1.0"
description = "Shared library: models, abstract scrapers/enrichers, DB repository, HTTP client, logging"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.51",
    "curl-cffi>=0.15.0",
    "pydantic>=2.13.0",
    "sentencex>=1.0.30",
    "instructor>=1.7.0",
    "openai>=1.60.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.4.0",
    "torch",
]
vision = [
    "docling>=2.113.0",
    "torch",
    "torchvision",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]
