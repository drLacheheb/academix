[project]
name = "llm-runner"
version = "0.1.0"
description = "Centralized High-Performance GGUF LLM Runner Service"
dependencies = [
    "core",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "llama-cpp-python>=0.2.70",
    "pydantic>=2.6.0",
    "huggingface-hub>=0.23.0",
    "onnxruntime-genai>=0.4.0",
    "python-dotenv>=1.0.0",
]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_llm_runner"]
