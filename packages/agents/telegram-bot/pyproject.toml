[project]
name = "telegram-bot"
version = "0.1.0"
description = "Multi-user Telegram bot interface for academic job matching system"
requires-python = "==3.12.*"
dependencies = [
    "core",
    "httpx>=0.28.0",
    "python-dotenv>=1.2.2",
    "python-telegram-bot[job-queue]>=21.0",
    "APScheduler>=3.10.4",
]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_bot"]
