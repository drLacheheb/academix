name: academix

services:
  # 0. Standalone Migration Runner (Runs pre-flight schema migrations)
  academix-migration-runner:
    build:
      context: .
      target: academix-migration-runner
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./packages:/app/packages
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
      - LOG_FILE=/app/logs/migration-runner.log
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/academix.db}
    restart: "no"

  # 1. FastAPI Gateway & Database Orchestrator
  academix-gateway-api:
    build:
      context: .
      target: academix-gateway-api
    depends_on:
      academix-migration-runner:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
      - ./data/uploads:/app/uploads
      - ./${HF_HOME:-models}:/app/models
      - ./logs:/app/logs
      - ./packages:/app/packages
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
      - HF_HOME=/app/${HF_HOME:-models}
      - HF_HUB_DISABLE_SYMLINKS_WARNING=${HF_HUB_DISABLE_SYMLINKS_WARNING:-1}
      - LOG_FILE=/app/logs/api.log
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/academix.db}
      - STALE_CLAIM_TIMEOUT_MINUTES=${STALE_CLAIM_TIMEOUT_MINUTES:-5}
      - API_SECRET_KEY=${API_SECRET_KEY:-dev_secret_key}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v1.5}
      - MODELS_DIR=/app/${MODELS_DIR:-models}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - DEGREE_SIMILARITY_THRESHOLD=${DEGREE_SIMILARITY_THRESHOLD:-0.71}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/status')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # 2. Euraxess Discovery Scraper
  academix-euraxess-discovery:
    build:
      context: .
      target: academix-euraxess-discovery
    depends_on:
      academix-gateway-api:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./packages:/app/packages
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
      - LOG_FILE=/app/logs/academix-euraxess-discovery.log
      - API_URL=http://academix-gateway-api:8000
      - API_SECRET_KEY=${API_SECRET_KEY:-dev_secret_key}
      - MAX_PAGES=${MAX_PAGES:-5}
      - MAX_SAFETY_PAGES=${MAX_SAFETY_PAGES:-500}
      - CRAWL_ONCE=${CRAWL_ONCE:-false}
      - CRAWL_INTERVAL=${CRAWL_INTERVAL:-3600}
    restart: unless-stopped

  # 3. AcademicTransfer Discovery Scraper
  academix-academic-discovery:
    build:
      context: .
      target: academix-academic-discovery
    depends_on:
      academix-gateway-api:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./packages:/app/packages
