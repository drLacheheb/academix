        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./packages:/app/packages
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
      - LOG_FILE=/app/logs/crawler-eurosciencejobs-discovery.log
      - API_URL=http://api:8000
      - API_SECRET_KEY=${API_SECRET_KEY:-dev_secret_key}
      - CRAWL_ONCE=${CRAWL_ONCE:-false}
      - CRAWL_INTERVAL=${CRAWL_INTERVAL:-21600}
    restart: unless-stopped

  # 13. EuroScienceJobs Sourcing Scraper (Continuous polling queue)
  crawler-eurosciencejobs-sourcing:
    build:
      context: .
      target: slim
    command: ["uv", "run", "--package", "eurosciencejobs-sourcing", "python", "-m", "eurosciencejobs_sourcing.main"]
    depends_on:
