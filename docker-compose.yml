      - LOG_FILE=/app/logs/crawler-researchgate-sourcing.log
      - API_URL=http://api:8000
      - API_SECRET_KEY=${API_SECRET_KEY:-dev_secret_key}
      - CRAWL_ONCE=${CRAWL_ONCE:-false}
      - CRAWL_INTERVAL=${CRAWL_INTERVAL:-15}
    restart: unless-stopped

  # 12. EuroScienceJobs Discovery Scraper (Continuous schedule)
  crawler-eurosciencejobs-discovery:
    build:
      context: .
      target: slim
    command: ["uv", "run", "--package", "eurosciencejobs-discovery", "python", "-m", "eurosciencejobs_discovery.main"]
    depends_on:
