        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./packages:/app/packages
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
      - LOG_FILE=/app/logs/crawler-eurosciencejobs-sourcing.log
      - API_URL=http://api:8000
      - API_SECRET_KEY=${API_SECRET_KEY:-dev_secret_key}
      - CRAWL_ONCE=${CRAWL_ONCE:-false}
      - CRAWL_INTERVAL=${CRAWL_INTERVAL:-15}
    restart: unless-stopped

  # 14. Language Detection worker
  lang-detection-worker:
    build:
      context: .
      target: lang-detection
    command: ["uv", "run", "--package", "lang-detection", "python", "-m", "agent_lang_detection.main"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./packages:/app/packages
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
      - LOG_FILE=/app/logs/lang-detection-worker.log
      - API_URL=http://api:8000
      - API_SECRET_KEY=${API_SECRET_KEY:-dev_secret_key}
      - AGENT_POLL_INTERVAL=${AGENT_POLL_INTERVAL:-10}
      - FTLANG_CACHE=/app/${HF_HOME:-models}
    restart: unless-stopped

  # 15. Local NLLB Translation worker
  translation-worker:
    build:
      context: .
      target: translation
    command: ["uv", "run", "--package", "translation", "python", "-m", "agent_translation.main"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./${HF_HOME:-models}:/app/models
      - ./logs:/app/logs
      - ./packages:/app/packages
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
      - HF_HOME=/app/${HF_HOME:-models}
      - HF_HUB_DISABLE_SYMLINKS_WARNING=${HF_HUB_DISABLE_SYMLINKS_WARNING:-1}
      - LOG_FILE=/app/logs/translation-worker.log
      - API_URL=http://api:8000
      - API_SECRET_KEY=${API_SECRET_KEY:-dev_secret_key}
      - MODELS_DIR=/app/${MODELS_DIR:-models}
      - NLLB_MODEL_PATH=${NLLB_MODEL_PATH:-mijuanlo/nllb-200-distilled-600M-ct2-int8}
      - AGENT_POLL_INTERVAL=${AGENT_POLL_INTERVAL:-10}
    restart: unless-stopped

  # 16. Centralized High-Performance Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./${MODELS_DIR:-models}:/models
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    restart: unless-stopped


  # 17. Gemma-4 Metadata Refinement worker
  refinement-worker:
    build:
      context: .
      target: refinement
    deploy:
      replicas: ${REFINEMENT_WORKER_REPLICAS:-1}

    command: ["uv", "run", "--package", "refinement", "python", "-m", "agent_refinement.main"]
    depends_on:
      api:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./logs:/app/logs
      - ./packages:/app/packages
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
      - LOG_FILE=/app/logs/refinement-worker.log
      - API_URL=http://api:8000
      - API_SECRET_KEY=${API_SECRET_KEY:-dev_secret_key}
      - LLM_SERVICE_URL=${LLM_SERVICE_URL:-http://ollama:11434}
      - LLM_MODEL=${LLM_MODEL:-hf.co/unsloth/gemma-4-E2B-it-GGUF:Q4_K_M}
      - AGENT_POLL_INTERVAL=${AGENT_POLL_INTERVAL:-10}
    restart: unless-stopped

  # 18. Dedicated Vector Embedding worker
  embedding-worker:
    build:
      context: .
      target: embedding
    command: ["uv", "run", "--package", "embedding-worker", "python", "-m", "agent_embedding.main"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./packages:/app/packages
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
      - LOG_FILE=/app/logs/embedding-worker.log
      - API_URL=http://api:8000
      - API_SECRET_KEY=${API_SECRET_KEY:-dev_secret_key}
      - AGENT_POLL_INTERVAL=${AGENT_POLL_INTERVAL:-10}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v1.5}
      - MODELS_DIR=/app/models
    restart: unless-stopped

  # 19. Matching and Explanations worker
  matching-worker:
    build:
      context: .
      target: matching
    command: ["uv", "run", "--package", "matching", "python", "-m", "agent_matching.main"]
    depends_on:
      api:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./logs:/app/logs
      - ./packages:/app/packages
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
      - MATCH_THRESHOLD=${MATCH_THRESHOLD:-0.7}
      - LOG_FILE=/app/logs/matching-worker.log
      - API_URL=http://api:8000
      - API_SECRET_KEY=${API_SECRET_KEY:-dev_secret_key}
      - LLM_SERVICE_URL=${LLM_SERVICE_URL:-http://ollama:11434}
      - LLM_MODEL=${LLM_MODEL:-hf.co/unsloth/gemma-4-E2B-it-GGUF:Q4_K_M}
      - AGENT_POLL_INTERVAL=${AGENT_POLL_INTERVAL:-15}
    restart: unless-stopped

  # 19. CV Ingestion and Parsing worker
  cv-parsing-worker:
    build:
      context: .
      target: cv-parsing
    command: ["uv", "run", "--package", "cv-parsing", "python", "-m", "agent_cv_parsing.main"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./data/uploads:/app/uploads
      - ./logs:/app/logs
      - ./packages:/app/packages
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
      - LOG_FILE=/app/logs/cv-parsing-worker.log
      - API_URL=http://api:8000
      - API_SECRET_KEY=${API_SECRET_KEY:-dev_secret_key}
      - AGENT_POLL_INTERVAL=${AGENT_POLL_INTERVAL:-10}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_REGION=${S3_REGION:-us-east-1}
    restart: unless-stopped

  # 20. Multi-User Telegram Bot Interface & Notifier
  telegram-bot:
    build:
      context: .
      target: slim
    command: ["uv", "run", "--package", "telegram-bot", "python", "-m", "telegram_bot.main"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./packages:/app/packages
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
      - LOG_FILE=/app/logs/telegram-bot.log
      - API_URL=http://api:8000
      - API_SECRET_KEY=${API_SECRET_KEY:-dev_secret_key}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    restart: unless-stopped




# Local host directories ./logs and ./models are used for storage and model persistence

