[project]
name = "academic"
version = "0.1.0"
description = "Distributed academic job sourcing & refinement system"
requires-python = "==3.12.*"
dependencies = [
    "inscriptis>=2.7.3",
    "markdown>=3.10.3",
]

[tool.uv]
override-dependencies = [
    "numpy==2.1.2",
]

[tool.uv.workspace]
members = ["packages/core", "packages/api", "packages/agents/*"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = [
    "packages/core/src",
    "packages/api/src",
    "packages/agents/refinement/src",
    "packages/agents/matching/src",
    "packages/agents/telegram-bot/src",
    "packages/agents/embedding-worker/src",
    "packages/agents/cv-parsing/src",
    "packages/agents/lang-detection/src",
    "packages/agents/translation/src",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
