services:
  # Standalone High-Performance PostgreSQL Server
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-academix_pass}
      POSTGRES_DB: ${POSTGRES_DB:-academix_db}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-academix_db}"]
      interval: 5s
      timeout: 5s
      retries: 12

  academix-migration-runner:
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-academix_pass}@db:5432/${POSTGRES_DB:-academix_db}
    depends_on:
      db:
        condition: service_healthy

  academix-gateway-api:
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-academix_pass}@db:5432/${POSTGRES_DB:-academix_db}
    depends_on:
      db:
        condition: service_healthy
      academix-migration-runner:
        condition: service_completed_successfully

  academix-abg-discovery:
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-academix_pass}@db:5432/${POSTGRES_DB:-academix_db}

  academix-abg-sourcing:
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-academix_pass}@db:5432/${POSTGRES_DB:-academix_db}

