name: Build and Deploy Academix to Azure Container Apps

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Log in to Azure CLI using Service Principal secret
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 2. Dynamically retrieve ACR & Resource Group info
      - name: Retrieve ACR Credentials
        id: acr
        run: |
          RESOURCE_GROUP="academix-rg"
          REGISTRY_NAME=$(az acr list --resource-group $RESOURCE_GROUP --query "[0].name" -o tsv)
          REGISTRY_SERVER="$REGISTRY_NAME.azurecr.io"
          ACR_USERNAME=$(az acr credential show --name $REGISTRY_NAME --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show --name $REGISTRY_NAME --query passwords[0].value -o tsv)
          
          echo "rg=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
          echo "registry_name=$REGISTRY_NAME" >> $GITHUB_OUTPUT
          echo "registry_server=$REGISTRY_SERVER" >> $GITHUB_OUTPUT
          echo "acr_username=$ACR_USERNAME" >> $GITHUB_OUTPUT
          echo "acr_password=$ACR_PASSWORD" >> $GITHUB_OUTPUT

      # 3. Log in to Docker Registry
      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.acr.outputs.registry_server }}
          username: ${{ steps.acr.outputs.acr_username }}
          password: ${{ steps.acr.outputs.acr_password }}

      # 4. Set up Docker Buildx with GitHub Actions Caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Build and Push Gateway API (slim target)
      - name: Build & Push Gateway API (slim)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: slim
          push: true
          tags: ${{ steps.acr.outputs.registry_server }}/academix-slim:latest
          cache-from: type=gha,scope=slim
          cache-to: type=gha,mode=max,scope=slim

      # 6. Build and Push Worker Images (embedding, refinement, matching, cv-parsing)
      - name: Build & Push Workers
        uses: docker/build-push-action@v5
        with:
          context: .
          target: cv-parsing
          push: true
          tags: ${{ steps.acr.outputs.registry_server }}/academix-cv-parsing:latest
          cache-from: type=gha,scope=cv-parsing
          cache-to: type=gha,mode=max,scope=cv-parsing

      # 7. Update Azure Container App service with the fresh image
      - name: Update Azure Container App
        run: |
          az containerapp update \
            --name academix-api \
            --resource-group ${{ steps.acr.outputs.rg }} \
            --image ${{ steps.acr.outputs.registry_server }}/academix-slim:latest
