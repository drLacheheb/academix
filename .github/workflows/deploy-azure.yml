name: CI/CD - Build and Deploy Academix Microservices to Azure

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  run-database-migrations:
    name: Build & Run Schema Migration Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Retrieve ACR Credentials
        id: acr
        run: |
          RESOURCE_GROUP="academix-rg"
          REGISTRY_NAME="academixreg8912"
          REGISTRY_SERVER="$REGISTRY_NAME.azurecr.io"
          ACR_USERNAME=$(az acr credential show --name $REGISTRY_NAME --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show --name $REGISTRY_NAME --query passwords[0].value -o tsv)

          echo "rg=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
          echo "registry_server=$REGISTRY_SERVER" >> $GITHUB_OUTPUT
          echo "acr_username=$ACR_USERNAME" >> $GITHUB_OUTPUT
          echo "acr_password=$ACR_PASSWORD" >> $GITHUB_OUTPUT

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.acr.outputs.registry_server }}
          username: ${{ steps.acr.outputs.acr_username }}
          password: ${{ steps.acr.outputs.acr_password }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push academix-migration-runner
        uses: docker/build-push-action@v5
        with:
          context: .
          target: academix-migration-runner
          push: true
          tags: ${{ steps.acr.outputs.registry_server }}/academix-migration-runner:latest
          cache-from: type=gha,scope=academix-migration-runner
          cache-to: type=gha,mode=max,scope=academix-migration-runner

      - name: Execute Migration Gate in Azure Container App Job
        run: |
          echo "Starting academix-migration-job in Azure..."
          az containerapp job start \
            --name academix-migration-job \
            --resource-group ${{ steps.acr.outputs.rg }} \
            --wait || (echo "[ERROR] Migration failed! Aborting deployment to prevent bad push." && exit 1)
          echo "[SUCCESS] Schema migration completed successfully!"

  deploy-microservices:
    name: Build & Deploy ${{ matrix.service }}
    needs: run-database-migrations
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - academix-gateway-api
          - academix-refinement-worker
          - academix-embedding-worker
          - academix-matching-worker
          - academix-cv-parsing-worker
          - academix-lang-detection-worker
          - academix-translation-worker
          - academix-telegram-bot
          - academix-cleanup-agent
          - academix-academic-discovery
          - academix-academic-sourcing
          - academix-euraxess-discovery
          - academix-euraxess-sourcing
          - academix-abg-discovery
          - academix-abg-sourcing
          - academix-naturecareers-discovery
          - academix-naturecareers-sourcing
          - academix-researchgate-discovery
          - academix-researchgate-sourcing
          - academix-euroscience-discovery
          - academix-euroscience-sourcing

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Retrieve ACR Credentials
        id: acr
        run: |
          RESOURCE_GROUP="academix-rg"
          REGISTRY_NAME="academixreg8912"
          REGISTRY_SERVER="$REGISTRY_NAME.azurecr.io"
          ACR_USERNAME=$(az acr credential show --name $REGISTRY_NAME --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show --name $REGISTRY_NAME --query passwords[0].value -o tsv)

          echo "rg=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
          echo "registry_server=$REGISTRY_SERVER" >> $GITHUB_OUTPUT
          echo "acr_username=$ACR_USERNAME" >> $GITHUB_OUTPUT
          echo "acr_password=$ACR_PASSWORD" >> $GITHUB_OUTPUT

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.acr.outputs.registry_server }}
          username: ${{ steps.acr.outputs.acr_username }}
          password: ${{ steps.acr.outputs.acr_password }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.service }}
          push: true
          tags: ${{ steps.acr.outputs.registry_server }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Deploy / Update Azure Container App
        run: |
          az containerapp update \
            --name ${{ matrix.service }} \
            --resource-group ${{ steps.acr.outputs.rg }} \
            --image ${{ steps.acr.outputs.registry_server }}/${{ matrix.service }}:latest
